<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸上文明 · 部落</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body class="game">
<canvas id="map" aria-label="纸面地图：族人在上面过日子；用三支笔写符、画线、照图纸盖房"></canvas>
<div class="hud hud-top">
  <div class="plate clock"><span id="clock"></span>
    <span class="speeds" role="group" aria-label="速度"><button data-speed="0" title="停（空格）">停</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button></span>
  </div>
  <div class="plate stats" id="stats"></div>
  <div class="plate menu">
    <button id="botBtn" title="让机器人替你当神：它写的符照样过识别器">托管</button>
    <button id="homeBtn" title="回营地（H）">回营地</button>
    <button id="newBtn" title="换一张纸重开">新纸</button>
    <a href="sandbox.html" title="M0：三支笔沙盘">沙盘</a>
    <a href="lab.html" title="符号实验室：练字、看识别器怎么想">实验室</a>
  </div>
</div>
<div class="hud plate chron" id="chron">
  <div class="row"><h3>编年</h3><span class="tabs"><button data-filter="big">大事</button><button data-filter="god">神迹</button><button data-filter="all">全部</button></span></div>
  <ol id="log"></ol>
</div>
<div class="hud plate who" id="who" hidden></div>
<div class="hud toast" id="toast" aria-live="polite"></div>
<div class="hud pens" id="pens">
  <button class="plate pen look" data-pen="look"><span class="ico"></span><span class="nm">看</span><span class="ds">挪图 · 点人 <kbd>Q</kbd></span></button>
  <button class="plate pen pencil" data-pen="pencil"><span class="ico"></span><span class="nm">铅笔</span><span class="ds">探路 · 修路 <kbd>1</kbd></span></button>
  <button class="plate pen ink" data-pen="ink"><span class="ico"></span><span class="nm">墨笔</span><span class="ds">号令 · 神迹 <kbd>2</kbd></span></button>
  <button class="plate pen red" data-pen="red"><span class="ico"></span><span class="nm">朱笔</span><span class="ds">封锁 · 禁 · 护 <kbd>3</kbd></span></button>
  <button class="plate pen" id="bpBtn"><span class="ico" style="background:var(--blue)"></span><span class="nm">图纸</span><span class="ds">火塘 · 窝棚 · 架 · 篱 <kbd>4</kbd></span></button>
</div>
<div class="hud plate hint" id="hint"></div>
<div id="pops"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="over" id="over" hidden></div>
<script type="module" src="src/game/main.js"></script>
</body>
</html>
